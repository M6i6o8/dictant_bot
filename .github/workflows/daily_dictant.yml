name: 🇬🇧 Ежедневный диктант

on:
  schedule:
    - cron: '10 23 * * *'   # 2:10 МСК (23:10 UTC предыдущего дня) - задание
    - cron: '20 23 * * *'   # 2:20 МСК (23:20 UTC предыдущего дня) - ответ
  workflow_dispatch:

jobs:
  send_dictant:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: pip install requests google-genai
      
      - run: python dictant_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
