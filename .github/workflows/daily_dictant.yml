name: 🇬🇧 Ежедневный диктант

on:
  schedule:
    # Задание: каждые 5 минут в интервале задания
    - cron: '30 7 * * *'   # 10:30 МСК
    - cron: '35 7 * * *'   # 10:35
    - cron: '40 7 * * *'   # 10:40
    - cron: '45 7 * * *'   # 10:45
    - cron: '50 7 * * *'   # 10:50
    - cron: '55 7 * * *'   # 10:55
    - cron: '0 8 * * *'    # 11:00 МСК (ответ)
    - cron: '5 8 * * *'    # 11:05
    - cron: '10 8 * * *'   # 11:10
    - cron: '15 8 * * *'   # 11:15
    - cron: '20 8 * * *'   # 11:20
    - cron: '25 8 * * *'   # 11:25
  workflow_dispatch:

jobs:
  send_dictant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests google-genai
      - run: python dictant_bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
