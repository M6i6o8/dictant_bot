name: 🇬🇧 Ежедневный диктант

on:
  schedule:
  # ЗАДАНИЕ: 18:45 - 19:04 МСК (15:45 - 16:04 UTC)
  - cron: '45 15 * * *'   # 18:45
  - cron: '50 15 * * *'   # 18:50
  - cron: '55 15 * * *'   # 18:55
  - cron: '0 16 * * *'    # 19:00
  # ОТВЕТ: 19:05 - 19:24 МСК (16:05 - 16:24 UTC)
  - cron: '5 16 * * *'    # 19:05
  - cron: '10 16 * * *'   # 19:10
  - cron: '15 16 * * *'   # 19:15
  - cron: '20 16 * * *'   # 19:20
  workflow_dispatch:

jobs:
  send_dictant:
    runs-on: ubuntu-latest
    # Даём права на запись в репозиторий, чтобы пушить изменения
    permissions:
      contents: write
    steps:
      - name: 📥 Клонируем репозиторий
        uses: actions/checkout@v4
        with:
          # Важно: пул с историей, чтобы можно было пушить
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Устанавливаем зависимости
        run: |
          pip install --upgrade pip
          pip install requests google-genai

      - name: 🤖 Запускаем бота
        id: run_bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: python dictant_bot.py
