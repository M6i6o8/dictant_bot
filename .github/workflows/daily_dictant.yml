name: 🇬🇧 Ежедневный диктант

on:
  schedule:
    # ЗАДАНИЕ: 14:00 - 14:30 МСК (11:00 - 11:30 UTC)
    - cron: '0 11 * * *'    # 14:00
    - cron: '5 11 * * *'    # 14:05
    - cron: '10 11 * * *'   # 14:10
    - cron: '15 11 * * *'   # 14:15
    - cron: '20 11 * * *'   # 14:20
    - cron: '25 11 * * *'   # 14:25
    - cron: '30 11 * * *'   # 14:30
    
    # ОТВЕТ: 15:00 - 15:30 МСК (12:00 - 12:30 UTC)
    - cron: '0 12 * * *'    # 15:00
    - cron: '5 12 * * *'    # 15:05
    - cron: '10 12 * * *'   # 15:10
    - cron: '15 12 * * *'   # 15:15
    - cron: '20 12 * * *'   # 15:20
    - cron: '25 12 * * *'   # 15:25
    - cron: '30 12 * * *'   # 15:30
  workflow_dispatch:

jobs:
  send_dictant:
    runs-on: ubuntu-latest
    # Даём права на запись в репозиторий, чтобы пушить изменения
    permissions:
      contents: write
    steps:
      - name: 📥 Клонируем репозиторий
        uses: actions/checkout@v4
        with:
          # Важно: пул с историей, чтобы можно было пушить
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Устанавливаем зависимости
        run: |
          pip install --upgrade pip
          pip install requests google-genai

      - name: 🤖 Запускаем бота
        id: run_bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: python dictant_bot.py
