name: 🇬🇧 Ежедневный диктант

on:
  schedule:
  # ЗАДАНИЕ: 17:45 - 18:00 МСК (каждые 5 минут)
  - cron: '45 14 * * *'   # 17:45 МСК
  - cron: '50 14 * * *'   # 17:50
  - cron: '55 14 * * *'   # 17:55
  - cron: '0 15 * * *'    # 18:00 МСК (начало ответа)
  # ОТВЕТ: 18:00 - 18:30 МСК (каждые 5 минут)
  - cron: '0 15 * * *'    # 18:00 МСК
  - cron: '5 15 * * *'    # 18:05
  - cron: '10 15 * * *'   # 18:10
  - cron: '15 15 * * *'   # 18:15
  - cron: '20 15 * * *'   # 18:20
  - cron: '25 15 * * *'   # 18:25
  - cron: '30 15 * * *'   # 18:30 (последний шанс для ответа)
  workflow_dispatch:

jobs:
  send_dictant:
    runs-on: ubuntu-latest
    # Даём права на запись в репозиторий, чтобы пушить изменения
    permissions:
      contents: write
    steps:
      - name: 📥 Клонируем репозиторий
        uses: actions/checkout@v4
        with:
          # Важно: пул с историей, чтобы можно было пушить
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Устанавливаем зависимости
        run: |
          pip install --upgrade pip
          pip install requests google-genai

      - name: 🤖 Запускаем бота
        id: run_bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: python dictant_bot.py
