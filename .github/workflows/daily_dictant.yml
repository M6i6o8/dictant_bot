name: 🇬🇧 Ежедневный диктант

on:
  workflow_dispatch:
  schedule:
    # ===== НАСТРОЙКА ВРЕМЕНИ (МЕНЯЙ ТОЛЬКО ТУТ!) =====
    # Задание: каждый час проверяем, не пора ли
    - cron: '*/5 * * * *'  # Каждые 5 минут

jobs:
  send_dictant:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Клонируем
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🐍 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Зависимости
        run: |
          pip install requests google-genai
      
      - name: 🤖 Запускаем бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          # Передаём время из переменных окружения
          TASK_HOUR_MSK: "17"      # Час задания
          TASK_MINUTE_MSK: "5"    # Минута задания
          ANSWER_HOUR_MSK: "17"    # Час ответа
          ANSWER_MINUTE_MSK: "15"   # Минута ответа
        run: python dictant_bot.py
