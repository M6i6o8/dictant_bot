name: 🇬🇧 Ежедневный диктант

on:
  schedule:
    # Задание: каждые 5 минут после TASK_HOUR_UTC
    - cron: '0 20 * * *'    # 23:00 МСК
    - cron: '5 20 * * *'    # 23:05
    - cron: '10 20 * * *'   # 23:10
    - cron: '15 20 * * *'   # 23:15
    - cron: '20 20 * * *'   # 23:20
    - cron: '25 20 * * *'   # 23:25
    - cron: '30 20 * * *'   # 23:30 - запасной
    
    # Ответ: каждые 5 минут после ANSWER_HOUR_UTC
    - cron: '0 21 * * *'    # 00:00 МСК
    - cron: '5 21 * * *'    # 00:05
    - cron: '10 21 * * *'   # 00:10
    - cron: '15 21 * * *'   # 00:15
    - cron: '20 21 * * *'   # 00:20
    - cron: '25 21 * * *'   # 00:25
    
  workflow_dispatch:

jobs:
  send_dictant:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Клонируем
        uses: actions/checkout@v4
        
      - name: 🐍 Устанавливаем Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 📦 Устанавливаем зависимости
        run: |
          pip install --upgrade pip
          pip install requests
          pip install google-genai
          
      - name: 🤖 Запускаем диктант
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: python dictant_bot.py
