name: 🇬🇧 Ежедневный диктант

on:
  schedule:
    - cron: '30 15 * * *'   # 18:30 - задание
    - cron: '0 16 * * *'    # 19:00 - ответ
    - cron: '5 16 * * *'    # 19:05 - контрольный
    - cron: '10 16 * * *'   # 19:10 - ещё один
    - cron: '15 16 * * *'   # 19:15 - и ещё
    - cron: '20 16 * * *'   # 19:20 - последний шанс
  workflow_dispatch:

jobs:
  send_dictant:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Клонируем
        uses: actions/checkout@v4
        
      - name: 🐍 Устанавливаем Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 📦 Устанавливаем зависимости
        run: |
          pip install --upgrade pip
          pip install requests
          pip install google-genai
          
      - name: 🤖 Запускаем диктант
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: python dictant_bot.py
