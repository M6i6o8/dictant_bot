name: 🇬🇧 Ежедневный диктант

on:
  schedule:
    # Задание: каждые 5 минут в интервале задания
    - cron: '15 8 * * *'   # 11:15 МСК
    - cron: '20 8 * * *'   # 11:20
    - cron: '25 8 * * *'   # 11:25
    - cron: '30 8 * * *'   # 11:30
    - cron: '35 8 * * *'   # 11:35
    - cron: '40 8 * * *'   # 11:40
    # Ответ: каждые 5 минут после ANSWER_HOUR_UTC
    - cron: '45 8 * * *'   # 11:45 МСК
    - cron: '50 8 * * *'   # 11:50
    - cron: '55 8 * * *'   # 11:55
    - cron: '0 9 * * *'    # 12:00 МСК
    - cron: '5 9 * * *'    # 12:05
    - cron: '10 9 * * *'   # 12:10
    - cron: '15 9 * * *'   # 12:15
  workflow_dispatch:

jobs:
  send_dictant:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Клонируем репозиторий
        uses: actions/checkout@v4
      
      - name: 📥 Загружаем сохранённое предложение из артефактов
        uses: actions/download-artifact@v4
        with:
          name: last-sentence
          path: ./
        continue-on-error: true  # Если артефакта нет - не падаем
      
      - name: 🐍 Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 📦 Устанавливаем зависимости
        run: |
          pip install --upgrade pip
          pip install requests
          pip install google-genai
      
      - name: 🤖 Запускаем бота
        id: run_bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: python dictant_bot.py
      
      - name: 📤 Сохраняем last_sentence.json в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: last-sentence
          path: last_sentence.json
          retention-days: 1  # Храним 1 день
          if-no-files-found: ignore  # Если файла нет - игнорируем
      
      - name: 📤 Сохраняем used_sentences.txt в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: used-sentences
          path: used_sentences.txt
          retention-days: 7  # Храним неделю
          if-no-files-found: ignore
      
      - name: 📤 Сохраняем answer_sent.txt в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: answer-sent
          path: answer_sent.txt
          retention-days: 7
          if-no-files-found: ignore
