name: 🇬🇧 Ежедневный диктант

on:
  schedule:
    # Задание: 12:50 МСК (09:50 UTC)
    - cron: '50 9 * * *'
    - cron: '55 9 * * *'
    - cron: '0 10 * * *'
    - cron: '5 10 * * *'
    - cron: '10 10 * * *'
    - cron: '15 10 * * *'
    # Ответ: 13:15 МСК (10:15 UTC)
    - cron: '15 10 * * *'
    - cron: '20 10 * * *'
    - cron: '25 10 * * *'
    - cron: '30 10 * * *'
    - cron: '35 10 * * *'
    - cron: '40 10 * * *'
    - cron: '45 10 * * *'
    - cron: '50 10 * * *'
    - cron: '55 10 * * *'
  workflow_dispatch:

jobs:
  send_dictant:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Клонируем репозиторий
        uses: actions/checkout@v4
      
      # Загружаем артефакты (если есть)
      - name: 📥 Загружаем last_sentence.json
        uses: actions/download-artifact@v4
        with:
          name: last-sentence
          path: ./
        continue-on-error: true
      
      - name: 📥 Загружаем used_sentences.txt
        uses: actions/download-artifact@v4
        with:
          name: used-sentences
          path: ./
        continue-on-error: true
      
      - name: 📥 Загружаем answer_sent.txt
        uses: actions/download-artifact@v4
        with:
          name: answer-sent
          path: ./
        continue-on-error: true
      
      - name: 🐍 Устанавливаем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 📦 Устанавливаем зависимости
        run: |
          pip install --upgrade pip
          pip install requests
          pip install google-genai
      
      - name: 🤖 Запускаем бота
        id: run_bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: python dictant_bot.py
      
      # Сохраняем артефакты для следующих запусков
      - name: 📤 Сохраняем last_sentence.json
        uses: actions/upload-artifact@v4
        with:
          name: last-sentence
          path: last_sentence.json
          retention-days: 1
          if-no-files-found: ignore
      
      - name: 📤 Сохраняем used_sentences.txt
        uses: actions/upload-artifact@v4
        with:
          name: used-sentences
          path: used_sentences.txt
          retention-days: 7
          if-no-files-found: ignore
      
      - name: 📤 Сохраняем answer_sent.txt
        uses: actions/upload-artifact@v4
        with:
          name: answer-sent
          path: answer_sent.txt
          retention-days: 7
          if-no-files-found: ignore
